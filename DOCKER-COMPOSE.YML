version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: caballeriza_db
    environment:
      POSTGRES_DB: caballeriza
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: caballeriza_api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/caballeriza
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    container_name: caballeriza_web
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:

